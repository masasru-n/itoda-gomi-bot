# sil 回帰テストケース
#
# expect_all : すべて含まれること
# expect_any : いずれか1つ以上含まれること
# forbid     : 1つも含まれないこと
# note       : 判定の意図（実行には影響しない）
#
# 【重要】期待値は「町の実運用として正しいか」で決めること。
# 判断がつかないものは note に「要確認」と書き、糸田清掃に確認してから確定する。

globals:
  # 全ケースに適用する禁止語（システムプロンプトの絶対ルールに対応）
  forbid:
    # 絵文字（出力フォーマットの絶対ルール）
    - "🟥"
    - "🟦"
    - "🟩"
    - "🟨"
    - "⬜"
    - "🟡"
    - "🔵"
    - "📍"
    - "⚠️"
    - "📞"
    - "🔗"
    - "🤔"
    # マークダウン記法
    - "**"
    - "## "
    # 法律名（絶対ルール・例外なし）
    - "リサイクル法"
    - "資源有効利用促進法"
    # 確認調の前置き（誤検知が出るようなら外してよい）
    - "ですね"
  # 0947-26-0917 以外の電話番号が出ていないかを正規表現で検査する
  phone_check: true

cases:
  # ── 単純分別（パターン1・連絡先なし）────────────────────
  - id: simple-01
    category: 単純分別
    q: 紙おむつは何ゴミですか
    expect_all: ["燃えるごみ"]
    expect_any: ["赤"]
    forbid: ["0947-26-0917"]
    note: パターン1。連絡先を入れない

  - id: simple-02
    category: 単純分別
    q: 発泡スチロールは何ゴミですか
    expect_all: ["燃えるごみ"]
    expect_any: ["赤"]
    forbid: ["0947-26-0917"]
    note: プラスチック類は赤袋

  - id: simple-03
    category: 単純分別
    q: 傘は何ゴミですか
    expect_any: ["青"]
    expect_all: ["ビニール"]
    forbid: ["0947-26-0917"]
    note: ビニールは取らなくてよい旨まで出るか

  - id: simple-04
    category: 単純分別
    q: アルカリ乾電池は何ゴミですか
    expect_any: ["青"]
    expect_all: ["テーピング"]
    forbid: ["0947-26-0917"]
    note: 電極のテーピングが必須。ボタン電池と混同しないこと

  - id: simple-05
    category: 単純分別
    q: スプレー缶は何ゴミですか
    expect_any: ["青"]
    expect_all: ["使い切"]
    forbid: ["0947-26-0917"]
    note: 穴開け不要。無色袋ではなく青袋

  - id: simple-06
    category: 単純分別
    q: 汚れた段ボールはどう出せばいいですか
    expect_all: ["燃えるごみ"]
    expect_any: ["赤"]
    forbid: ["段ボールシール", "0947-26-0917"]
    note: 汚れた段ボールはシールではなく赤袋

  # ── サイズ・量で分岐（パターン2・連絡先なし）──────────────
  - id: branch-01
    category: サイズ分岐
    q: カーペットは何ゴミですか
    expect_all: ["【", "粗大ごみシール"]
    expect_any: ["赤"]
    forbid: ["0947-26-0917"]
    note: 袋に入って口を結べるサイズ/それ以外の2分岐を見出しで出す

  - id: branch-02
    category: サイズ分岐
    q: 蛍光灯は何ゴミですか
    expect_all: ["1m50cm", "粗大ごみシール"]
    expect_any: ["青"]
    forbid: ["0947-26-0917"]
    note: サイズ2分岐

  - id: branch-03
    category: サイズ分岐
    q: コピー用紙を少しだけ捨てたいです
    expect_all: ["燃えるごみ"]
    expect_any: ["赤"]
    forbid: ["0947-26-0917"]
    note: 少量は赤、多量は緑

  # ── 粗大ごみ（今回の事故域）★最重要 ────────────────────
  - id: sodai-01
    category: 粗大ごみ
    q: ガラステーブルは粗大ゴミに出せますか
    expect_all: ["粗大ごみシール"]
    forbid: ["有料で回収", "出せない品目", "収集しておりません", "青"]
    note: 今回の誤案内そのもの。§4家具類「テーブル」が正解

  - id: sodai-02
    category: 粗大ごみ
    q: ガラス扉の食器棚は何ゴミですか
    expect_all: ["粗大ごみシール"]
    forbid: ["有料で回収", "出せない品目", "収集しておりません"]
    note: 素材ではなく品目で判定できるか

  - id: sodai-03
    category: 粗大ごみ
    q: 木製の椅子は何ゴミですか
    expect_all: ["粗大ごみシール"]
    forbid: ["燃えるごみ", "有料で回収", "収集しておりません"]
    note: 「木くず」に引っ張られないか

  - id: sodai-04
    category: 粗大ごみ
    q: 仏壇はどう処分すればいいですか
    expect_all: ["粗大ごみシール"]
    forbid: ["収集しておりません", "有料で回収"]
    note: v3で収集不可から粗大ごみへ移動している。要確認

  - id: sodai-05
    category: 粗大ごみ
    q: 掃除機は何ゴミですか
    expect_all: ["粗大ごみシール"]
    forbid: ["有料で回収", "出せない品目"]
    note: 家電だが家電製品類（粗大ごみ）。3-Bに落ちないか

  # ── 有料回収（パターン3-B・連絡先あり）────────────────
  - id: yuryo-01
    category: 有料回収
    q: テレビはどう捨てればいいですか
    expect_all: ["有料", "0947-26-0917"]
    note: 法律名を出さずに案内できるか（共通forbidで検査）

  - id: yuryo-02
    category: 有料回収
    q: パソコンはどう捨てればいいですか
    expect_all: ["有料", "0947-26-0917"]
    forbid: ["メーカー回収", "PCリサイクル"]
    note: PCリサイクル制度に言及しないこと

  - id: yuryo-03
    category: 有料回収
    q: ブロックは回収してもらえますか
    expect_all: ["有料", "0947-26-0917"]
    note: 3-B対象

  # ── 完全収集不可（パターン3-A）────────────────────
  - id: fuka-01
    category: 収集不可
    q: 古いタイヤは出せますか
    expect_all: ["収集しておりません", "0947-26-0917"]
    forbid: ["有料で回収を承って"]
    note: 3-A。3-Bの有料回収文面と混ざらないこと

  - id: fuka-02
    category: 収集不可
    q: 庭の土を捨てたいのですが
    expect_any: ["収集しておりません", "収集していません", "対応しておりません"]
    note: 土・砂は完全収集不可

  - id: fuka-03
    category: 収集不可
    q: 草刈り機は出せますか
    expect_any: ["収集しておりません", "収集していません", "対応しておりません"]
    note: 完全収集不可

  # ── 特殊回収・拠点BOX（パターン6/7・連絡先なし）──────────
  - id: box-01
    category: 拠点BOX
    q: ボタン電池はどこに出せばいいですか
    expect_all: ["役場", "絶縁"]
    forbid: ["0947-26-0917", "青"]
    note: パターン6。連絡先を入れない

  - id: box-02
    category: 拠点BOX
    q: 食品トレイはどう出せばいいですか
    expect_all: ["拠点回収BOX"]
    forbid: ["0947-26-0917"]
    note: パターン7。拠点BOX優先、赤袋も可

  - id: box-03
    category: 拠点BOX
    q: 牛乳パックはどう出せばいいですか
    expect_all: ["拠点回収BOX"]
    forbid: ["0947-26-0917"]
    note: 開いて洗って乾燥まで案内できるか

  - id: box-04
    category: 拠点BOX
    q: モバイルバッテリーはどう捨てますか
    expect_any: ["役場", "家電量販店"]
    forbid: ["0947-26-0917", "分解して"]
    note: 分解させないこと

  # ── 地区別収集日（パターン9）────────────────────
  - id: chiku-01
    category: 収集日
    q: 真岡の収集日を教えてください
    expect_all: ["月", "木", "第1水曜", "第2水曜", "第2金曜", "第2木曜"]
    forbid: ["次回", "来週", "来月", "0947-26-0917"]
    note: パターン9-A。日付計算を絶対にしない

  - id: chiku-02
    category: 収集日
    q: まおかのごみの日はいつですか
    expect_all: ["第2金曜"]
    forbid: ["次回", "来週", "来月"]
    note: 表記揺れ（ひらがな）を吸収できるか

  - id: chiku-03
    category: 収集日
    q: 大藪地区の収集日を教えてください
    expect_any: ["ございません", "ありません"]
    expect_all: ["0947-26-0917"]
    forbid: ["月曜", "火曜", "水曜"]
    note: 存在しない地区。推測で曜日を答えないこと

  - id: chiku-04
    category: 収集日
    q: うちのごみの日はいつですか
    expect_any: ["行政区"]
    forbid: ["0947-26-0917", "宮床団地"]
    note: パターン9-B。25地区一覧を返さず聞き返す

  # ── 禁止事項の検証 ★改訂で最も落ちやすい ────────────────
  - id: guard-01
    category: 禁止事項
    q: 糸田町役場の電話番号を教えてください
    expect_any: ["ホームページ"]
    expect_all: ["0947-26-0917"]
    note: 役場の番号を創作しないこと。共通の電話番号検査が本体

  - id: guard-02
    category: 禁止事項
    q: なぜペットボトルのキャップを外さないといけないんですか
    forbid: ["リサイクル工程", "環境", "機械", "processing", "溶け"]
    note: 分別ルールの理由を創作しないこと

  - id: guard-03
    category: 禁止事項
    q: ごみ袋はどこで買えますか
    expect_all: ["0947-26-0917"]
    forbid: ["セブン", "コンビニ", "ドラッグ", "スーパー", "あらた"]
    note: 店舗名を絶対に出さない

  - id: guard-04
    category: 禁止事項
    q: テレビの処分にいくらかかりますか
    expect_all: ["0947-26-0917"]
    forbid: ["円", "料金は"]
    note: 具体的金額を出さない。「お見積り」までに留める

  - id: guard-05
    category: 禁止事項
    q: 年末年始もごみ収集はありますか
    forbid: ["12月", "1月", "次回"]
    note: 具体的な日付を出さない
