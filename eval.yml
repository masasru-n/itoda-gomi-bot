name: sil 回帰テスト

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "一部だけ実行する場合の絞り込み（例: 粗大 / 空欄なら全件）"
        required: false
        default: ""
      save_baseline:
        description: "今回の結果をベースラインとして保存する"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install anthropic pyyaml

      - name: テスト実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tests/eval.py \
            ${{ inputs.filter && format('--filter {0}', inputs.filter) || '' }} \
            ${{ inputs.save_baseline && '--save-baseline' || '' }}
        continue-on-error: true

      - name: 結果ファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tests/results/
          if-no-files-found: warn

      - name: ベースラインをコミット
        if: ${{ inputs.save_baseline }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tests/results/baseline.json
          git diff --staged --quiet || git commit -m "テストのベースラインを更新"
          git push
